# dsh-llm-provider 的 bundle patch 层。
#
# 按 cordis 的 patch 语义写：顶层数组，`- id: <行 id>` 定向覆盖（`disabled: true` 禁用它），
# `- insert: [...]` 往插件树里插行。插进来的行按顺序建索引，后面的 patch 还能指向它。
# 命不中的 id，dsh 只警告并跳过（@deepseek-ai/cordis-plugin-include 的语义）——所以本文件
# 挂到不含这些行的 profile 上也安全。
#
# 本插件要接管的官方行全部在这里禁用：
#
# 1) llm-pi-ai：ctx.llm.registerAdapter 对同名路由直接抛 DUPLICATE_ADAPTER，没有遮蔽机制，
#    桥接要接手路由只能在这一层禁用官方行。本插件内部的桥接副本接管它的全部行为
#    （settings 段、模型发现、模型选择器目录），对用户不可见地换到新版 pi-ai。
# 2) llm-deepseek：禁用理由不变（全世界只留 pi-ai 一套 adapter）。DeepSeek 路由的 base
#    声明按内核分派（下方 insert 行的条件表达式）：0.1.5 系桥接接管时提供完整路由
#    （用户 settings.yaml 常见 models-only 条目，靠这层字段级补全）；0.1.7+ 官方已有
#    登录态的 deepseek-account，表达式返回 {}——不复活官方模型（09-27 决策在其场景内维持）。
# 3) ui-model-selection：模型选择器整体由本插件接管（座位 + /model 命令 + 目录状态机）。
#    座位本身可以用负 priority 遮蔽（本插件仍留着 priority: -10），但那样官方插件还在跑：
#    它会再拉一份目录、还会推 composer 的「当前模型不可路由」置灰状态，两套状态机并存只会
#    互相打架。整行禁用后，我们自己的目录路径就是唯一路径。核对过 client/ 全量引用：没有
#    别的插件依赖它提供的 modelDirectories 服务，禁掉不会让谁卡在 pending。
# 4) ui-settings-models：官方 Models 页禁用，「配置+展示一体」在本插件的「模型服务」标签里做。
#    它独有的逐模型清单编辑（ModelListEditor / DeepSeekModelsEditor / CustomProviderCard）
#    没有替代——记在 README「已知缺口」一节。
- id: llm-pi-ai
  disabled: !!js (()=>{try{const fs=process.getBuiltinModule?process.getBuiltinModule("node:fs"):null;if(!fs||typeof fs.readFileSync!=="function"||typeof fs.existsSync!=="function")return false;const sep=process.platform==="win32"?"\\":"/";const pkg="node_modules"+sep+"@deepseek-ai"+sep+"dsh"+sep+"package.json";const starts=[];if(process.argv&&typeof process.argv[1]==="string")starts.push(process.argv[1]);if(typeof process.execPath==="string")starts.push(process.execPath);for(const start of starts){let dir=start;for(let hop=0;hop<12;hop+=1){const cut=Math.max(dir.lastIndexOf("/"),dir.lastIndexOf("\\"));if(cut<=0)break;dir=dir.slice(0,cut);const root=dir+sep+pkg;if(fs.existsSync(root)){let native=false;try{const v=JSON.parse(fs.readFileSync(root,"utf8")).version;if(typeof v==="string"){const m=/^(\d+)\.(\d+)\.(\d+)/.exec(v.trim());if(m)native=Number(m[1])>0||Number(m[2])>1||(Number(m[2])===1&&Number(m[3])>=7)}}catch{}if(native)return false;break;}}}const spec="node_modules"+sep+"@earendil-works"+sep+"pi-ai";for(const start of starts){let dir=start;for(let hop=0;hop<12;hop+=1){const cut=Math.max(dir.lastIndexOf("/"),dir.lastIndexOf("\\"));if(cut<=0)break;dir=dir.slice(0,cut);const root=dir+sep+spec;if(fs.existsSync(root+sep+"package.json")&&fs.existsSync(root+sep+"dist"+sep+"index.js"))return true}}return false}catch{return false}})()
  # 内核 >= 0.1.7：本行放行给原生 pi-ai（volatile config 直接吃用户 llm-pi-ai.providers）。
  # 内核 < 0.1.7：本行被禁用，deepseek 基础路由由下方 insert 的 dsh-llm-provider 行
  # 的条件 config 声明带给桥接（两处判定同一探测骨架）。

- id: llm-deepseek
  disabled: !!js (()=>{try{const fs=process.getBuiltinModule?process.getBuiltinModule("node:fs"):null;if(!fs||typeof fs.existsSync!=="function")return false;const sep=process.platform==="win32"?"\\":"/";const spec="node_modules"+sep+"@earendil-works"+sep+"pi-ai";const starts=[];if(process.argv&&typeof process.argv[1]==="string")starts.push(process.argv[1]);if(typeof process.execPath==="string")starts.push(process.execPath);for(const start of starts){let dir=start;for(let hop=0;hop<12;hop+=1){const cut=Math.max(dir.lastIndexOf("/"),dir.lastIndexOf("\\"));if(cut<=0)break;dir=dir.slice(0,cut);const root=dir+sep+spec;if(fs.existsSync(root+sep+"package.json")&&fs.existsSync(root+sep+"dist"+sep+"index.js"))return true}}return false}catch{return false}})()

- id: ui-model-selection
  disabled: !!js (()=>{try{const fs=process.getBuiltinModule?process.getBuiltinModule("node:fs"):null;if(!fs||typeof fs.existsSync!=="function")return false;const sep=process.platform==="win32"?"\\":"/";const spec="node_modules"+sep+"@earendil-works"+sep+"pi-ai";const starts=[];if(process.argv&&typeof process.argv[1]==="string")starts.push(process.argv[1]);if(typeof process.execPath==="string")starts.push(process.execPath);for(const start of starts){let dir=start;for(let hop=0;hop<12;hop+=1){const cut=Math.max(dir.lastIndexOf("/"),dir.lastIndexOf("\\"));if(cut<=0)break;dir=dir.slice(0,cut);const root=dir+sep+spec;if(fs.existsSync(root+sep+"package.json")&&fs.existsSync(root+sep+"dist"+sep+"index.js"))return true}}return false}catch{return false}})()

- id: ui-settings-models
  disabled: !!js (()=>{try{const fs=process.getBuiltinModule?process.getBuiltinModule("node:fs"):null;if(!fs||typeof fs.existsSync!=="function")return false;const sep=process.platform==="win32"?"\\":"/";const spec="node_modules"+sep+"@earendil-works"+sep+"pi-ai";const starts=[];if(process.argv&&typeof process.argv[1]==="string")starts.push(process.argv[1]);if(typeof process.execPath==="string")starts.push(process.execPath);for(const start of starts){let dir=start;for(let hop=0;hop<12;hop+=1){const cut=Math.max(dir.lastIndexOf("/"),dir.lastIndexOf("\\"));if(cut<=0)break;dir=dir.slice(0,cut);const root=dir+sep+spec;if(fs.existsSync(root+sep+"package.json")&&fs.existsSync(root+sep+"dist"+sep+"index.js"))return true}}return false}catch{return false}})()

- insert:
    - id: dsh-llm-provider
      name: '@ztyss/dsh-llm-provider'
      # deepseek 基础路由的 base 声明（条件表达式，与 llm-pi-ai 行禁用条件同一探测
      # 骨架）：旧内核且桥接接管 → 完整路由；内核 >= 0.1.7 → {}（不复活官方模型）。
      # 用户想改就在 settings.yaml 里写同名的 llm-pi-ai.providers.deepseek，用户层覆盖。
      config:
        providers: !!js (()=>{try{const fs=process.getBuiltinModule?process.getBuiltinModule("node:fs"):null;if(!fs||typeof fs.readFileSync!=="function"||typeof fs.existsSync!=="function")return {};const sep=process.platform==="win32"?"\\":"/";const pkg="node_modules"+sep+"@deepseek-ai"+sep+"dsh"+sep+"package.json";const starts=[];if(process.argv&&typeof process.argv[1]==="string")starts.push(process.argv[1]);if(typeof process.execPath==="string")starts.push(process.execPath);for(const start of starts){let dir=start;for(let hop=0;hop<12;hop+=1){const cut=Math.max(dir.lastIndexOf("/"),dir.lastIndexOf("\\"));if(cut<=0)break;dir=dir.slice(0,cut);const root=dir+sep+pkg;if(fs.existsSync(root)){let native=false;try{const v=JSON.parse(fs.readFileSync(root,"utf8")).version;if(typeof v==="string"){const m=/^(\d+)\.(\d+)\.(\d+)/.exec(v.trim());if(m)native=Number(m[1])>0||Number(m[2])>1||(Number(m[2])===1&&Number(m[3])>=7)}}catch{}if(native)return {};break;}}}const spec="node_modules"+sep+"@earendil-works"+sep+"pi-ai";for(const start of starts){let dir=start;for(let hop=0;hop<12;hop+=1){const cut=Math.max(dir.lastIndexOf("/"),dir.lastIndexOf("\\"));if(cut<=0)break;dir=dir.slice(0,cut);const root=dir+sep+spec;if(fs.existsSync(root+sep+"package.json")&&fs.existsSync(root+sep+"dist"+sep+"index.js"))return {"deepseek":{"displayName":"DeepSeek","apiKeyEnv":"DEEPSEEK_API_KEY","api":"openai-completions","baseURL":"https://api.deepseek.com"}}}}return {}}catch{return {}}})()
